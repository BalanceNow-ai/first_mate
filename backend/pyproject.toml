[project]
name = "helm-backend"
version = "0.1.0"
description = "Helm Marine Platform - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "uvicorn-worker>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    "httpx>=0.28.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "stripe>=11.0.0",
    "pyjwt[crypto]>=2.9.0",
    "openai>=1.50.0",
    "pgvector>=0.3.0",
    "typesense>=0.21.0",
    "resend>=2.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-multipart>=0.0.12",
    # Service jobs: private media (decode/strip/derive), inert PDF checks, S3 storage.
    "pillow>=11.0.0",
    "pillow-heif>=0.21.0",
    "pypdf>=5.1.0",
    "boto3>=1.35.0",
    "tzdata>=2024.1",  # Pacific/Auckland periods must not depend on the image's zoneinfo
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long SQL literals in migrations and the legacy-data migration test.
"alembic/versions/*.py" = ["E501"]
"app/tests/test_migrations.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
