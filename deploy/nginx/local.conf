# Helm local acceptance stack — reverse proxy (mounted as /etc/nginx/conf.d/default.conf)
#
#   /            Flutter web build (SPA fallback)
#   /api/        -> api:8000
#   /auth/v1/    -> auth:9999 (local Supabase GoTrue; the /auth/v1 prefix is stripped)
#   /health      -> api liveness
#   /ready       -> api readiness (database, redis, worker heartbeat)
#
# Listens on 8080 inside the container (non-root nginx); published on the host as
# ${HELM_WEB_PORT:-18080}. Plain HTTP only — local development.

include /etc/nginx/snippets/http-common.conf;

server {
    listen 8080 default_server;
    server_name _;
    access_log /dev/stdout helm_noquery;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/api-locations.conf;

    location = /ready {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $helm_api;
    }

    set $helm_auth http://auth:9999;
    location /auth/v1/ {
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $helm_auth;
    }

    include /etc/nginx/snippets/spa.conf;
}
