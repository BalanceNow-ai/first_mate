# Helm local acceptance stack — reverse proxy (mounted as /etc/nginx/conf.d/default.conf)
#
#   /            Flutter web build (SPA fallback)
#   /api/        -> api:8000
#   /auth/v1/    -> auth:9999 (local Supabase GoTrue; the /auth/v1 prefix is stripped)
#   /health      -> api liveness
#   /ready       -> api readiness (database, redis, worker heartbeat)
#   /helm-private/ -> objectstore:7070 (presigned GET/HEAD for service-job media only)
#
# Listens on 8080 inside the container (non-root nginx); published on the host as
# ${HELM_WEB_PORT:-18080}. Plain HTTP only — local development.

include /etc/nginx/snippets/http-common.conf;

server {
    listen 8080 default_server;
    server_name _;
    access_log /dev/stdout helm_noquery;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/api-locations.conf;

    location = /ready {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $helm_api;
    }

    # Private service-job media bucket (VersityGW, S3 API). The API signs short-lived
    # (<= 5 min) GET URLs for HELM_PUBLIC_URL; this location only forwards them. The
    # Host header is passed through unchanged ($http_host keeps the port) because it is
    # part of the SigV4 signature. GET/HEAD only; no client credentials or cookies are
    # forwarded; responses download as attachments and are never cached or sniffed.
    set $helm_objectstore http://objectstore:7070;
    location ^~ /helm-private/ {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
        gzip off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        proxy_pass $helm_objectstore;
    }

    set $helm_auth http://auth:9999;
    location /auth/v1/ {
        include /etc/nginx/snippets/proxy-params.conf;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $helm_auth;
    }

    include /etc/nginx/snippets/spa.conf;
}
