# Helm production reverse proxy (mounted as /etc/nginx/conf.d/default.conf).
#
#   :8080 (host 80)   ACME http-01 challenges, /health, private-network /ready, else -> HTTPS
#   :8443 (host 443)  TLS: Flutter web SPA, /api/ -> api:8000, /health, /ready (private only)
#
# Authentication is the hosted Supabase project (the client talks to it directly), so
# there is no /auth/v1 proxy here.
#
# Certificates: /etc/nginx/certs/fullchain.pem and privkey.pem, mounted read-only from
# HELM_TLS_DIR (see deploy/certbot-deploy-hook.sh and the Operations Runbook).

include /etc/nginx/snippets/http-common.conf;

# Coarse per-client flood protection in front of the application's own rate limits.
limit_req_zone $binary_remote_addr zone=helm_per_ip:10m rate=30r/s;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name _;
    access_log /dev/stdout helm_noquery;

    include /etc/nginx/snippets/security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    set $helm_api http://api:8000;

    # Plain-HTTP liveness for load balancers / uptime checks.
    location = /health {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $helm_api;
    }

    # Readiness reveals migration/worker state: private networks only (the host itself
    # reaches the published port via the Docker bridge, which is private).
    location = /ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $helm_api;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    access_log /dev/stdout helm_noquery;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:helm_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    limit_req zone=helm_per_ip burst=120 nodelay;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/api-locations.conf;

    location = /ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $helm_api;
    }

    include /etc/nginx/snippets/spa.conf;
}
