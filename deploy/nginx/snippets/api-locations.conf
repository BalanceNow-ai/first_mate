# API, health and webhook locations (server context). Upstreams are variables so the
# resolver re-resolves Docker service names (see http-common.conf).
set $helm_api http://api:8000;

location /api/ {
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_pass $helm_api;
}

# Payment webhooks: the provider signs the exact raw body. Pass it through unbuffered
# and unmodified (no gzip, no rewriting), with a small body limit.
location ~ ^/api/v1/(payments/webhooks?|webhooks/) {
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_request_buffering off;
    client_max_body_size 1m;
    gzip off;
    proxy_pass $helm_api;
}

location = /health {
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_pass $helm_api;
}
# /ready is defined by each server configuration (production restricts who may call it).
