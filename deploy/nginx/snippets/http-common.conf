# http-level settings shared by the local and production proxy configurations
# (included from /etc/nginx/conf.d/default.conf, which nginx loads in http context).

server_tokens off;

# Access log WITHOUT query strings ($uri, not $request): confirmation tokens, e-mail
# addresses and search terms can appear in query strings.
# The base image's http-level `access_log ... main` logs $request (with the query), so
# every server block must set `access_log /dev/stdout helm_noquery;` itself: a
# server-level access_log replaces the inherited one.
log_format helm_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# Docker's embedded DNS; re-resolve service names so a recreated container's new
# address is picked up without restarting the proxy.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $scheme $helm_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

client_max_body_size 20m;
client_body_timeout 30s;
client_header_timeout 30s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/wasm application/manifest+json image/svg+xml font/ttf font/otf;
