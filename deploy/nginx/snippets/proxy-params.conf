# Common reverse-proxy settings (included inside proxied locations).
# The API trusts X-Forwarded-* only from the proxy network (FORWARDED_ALLOW_IPS);
# uvicorn takes the right-most untrusted address of X-Forwarded-For, so a client-sent
# X-Forwarded-For header cannot spoof the address used for rate limiting.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 90s;
proxy_buffering on;
proxy_redirect off;
