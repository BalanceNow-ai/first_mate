# Security headers shared by the local and production proxies.
#
# nginx only inherits add_header directives from the enclosing level when the current
# level defines none, so every location that adds its own header must include this
# file again.
#
# Content-Security-Policy is written for the Flutter web build (CanvasKit/WASM from
# gstatic, Google fonts), Stripe.js (script + frames + API), Supabase (*.supabase.co
# REST/realtime), Sentry ingest, PostHog and Mapbox. If you use a Supabase custom
# domain or self-host any of these, add the origin to connect-src.
# Service jobs: camera=(self) allows guided photo capture in the browser, and blob: in
# connect-src lets the web file/camera picker read the chosen file before upload. Signed
# media downloads must come from this origin (route the bucket through the proxy, as the
# local /helm-private/ location does) or that origin must be added to connect-src.
# HSTS is sent only on HTTPS responses: $helm_hsts comes from a `map $scheme` in the
# server configuration and is empty over plain HTTP (nginx skips empty headers).
add_header Strict-Transport-Security $helm_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Permissions-Policy "camera=(self), microphone=(), usb=(), geolocation=(self), payment=(self \"https://js.stripe.com\")" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://js.stripe.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://*.posthog.com https://api.mapbox.com https://events.mapbox.com https://www.gstatic.com https://fonts.gstatic.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
