# Flutter web single-page application (served from /usr/share/nginx/html).
# Flutter's main.dart.js / flutter_bootstrap.js are not content-hashed, so the app
# shell is always revalidated (ETag); only the engine-versioned canvaskit/ is cached.
root /usr/share/nginx/html;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
}

location /canvaskit/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/snippets/security-headers.conf;
}
