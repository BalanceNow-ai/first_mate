# =============================================================================
# Helm — PRODUCTION stack (single host). Driven by deploy/deploy.sh:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml ...
#
# * Authentication is the hosted Supabase project (no GoTrue here).
# * No local substitutes: the API/worker refuse to start in production with any of them
#   (Settings.validate_runtime), and deploy.sh runs that validation before migrating.
# * Postgres, Redis and Typesense are on an internal network with NO published ports.
# * Only the web proxy publishes 80/443 (TLS certificates mounted read-only).
# * `migrate` is a one-shot that must exit 0 before api/worker/beat start; the API never
#   migrates on its own.
# * Application settings reach api/worker/beat/migrate through env_file .env.prod; the
#   data stores and the proxy only receive the variables listed for them.
# =============================================================================
name: helm-prod

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  image: ${HELM_IMAGE_REPO:-helm}/backend:${HELM_IMAGE_TAG:?HELM_IMAGE_TAG is set by deploy/deploy.sh}
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
    target: production
    secrets: [build_ca]
  env_file: [.env.prod]
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env.prod}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}@redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
    SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env.prod}
    AUTH_MODE: ${AUTH_MODE:?set AUTH_MODE (jwks|hs256) in .env.prod}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env.prod}
    RATE_LIMIT_BACKEND: redis
    TYPESENSE_HOST: typesense
    TYPESENSE_PORT: "8108"
    TYPESENSE_PROTOCOL: http
    TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env.prod}
    FORWARDED_ALLOW_IPS: ${HELM_EDGE_SUBNET:-10.247.90.0/24}
  <<: [*hardening, *logging]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  networks: [data, egress]

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    shm_size: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "${HELM_DB_CPUS:-1.5}", memory: "${HELM_DB_MEMORY:-2g}" }
    <<: *logging
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
    # The password goes into a tmpfs config file, not onto the command line.
    command:
      - sh
      - -c
      - umask 077; printf 'requirepass %s\nappendonly yes\nsave 300 10\n' "$$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf
    # Runs directly as the image's redis user (owner of /data); no capabilities needed.
    user: redis
    volumes: ["redis_data:/data"]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${HELM_REDIS_MEMORY:-512m}" }
    <<: *logging
    networks: [data]
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env.prod}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "false"
    volumes: ["typesense_data:/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${HELM_TYPESENSE_MEMORY:-1g}" }
    <<: *logging
    networks: [data]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["migrate"]
    networks: [data]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      typesense: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${HELM_API_CPUS:-2.0}", memory: "${HELM_API_MEMORY:-1536m}" }
    networks: [data, edge, egress]
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      typesense: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${HELM_WORKER_CPUS:-1.0}", memory: "${HELM_WORKER_MEMORY:-1g}" }
    restart: unless-stopped

  beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes: ["beat_data:/var/lib/helm/beat"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "256m" }
    restart: unless-stopped

  web:
    image: ${HELM_IMAGE_REPO:-helm}/web:${HELM_IMAGE_TAG:?HELM_IMAGE_TAG is set by deploy/deploy.sh}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      secrets: [build_ca]
      args:
        API_BASE_URL: ${HELM_PUBLIC_URL:?set HELM_PUBLIC_URL (https://your-domain) in .env.prod}/api/v1
        SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env.prod}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY (public anon key) in .env.prod}
        APP_ENV: production
        SENTRY_DSN: ${SENTRY_DSN_WEB:-}
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ${HELM_TLS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - ./deploy/certbot-www:/var/www/certbot:ro
    ports:
      - "${HELM_HTTP_PORT:-80}:8080"
      - "${HELM_HTTPS_PORT:-443}:8443"
    <<: [*hardening, *logging]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "256m" }
    networks:
      public: {}
      edge: {}
    restart: unless-stopped

networks:
  # Data stores: no route to the internet, never published.
  data:
    internal: true
  # Proxy <-> API. Fixed subnet: the API trusts X-Forwarded-* only from it.
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${HELM_EDGE_SUBNET:-10.247.90.0/24}
  # Outbound access for the API and workers (Stripe, Supabase JWKS, Resend, OpenAI...).
  egress: {}
  # Published ports (80/443).
  public: {}

volumes:
  pg_data:
  redis_data:
  typesense_data:
  beat_data:

secrets:
  build_ca:
    file: ${HELM_BUILD_CA_FILE:-./deploy/no-build-ca.pem}
